[core]
quit_key = "esc"

[docker]
docker_enabled = true
docker_image = "python:3.12-slim"
docker_container_prefix = "agent-sandbox"
docker_mem_limit = "512m"
docker_cpus = 1.0
docker_network = "bridge"
docker_command_timeout = 30

[char]
char_name = "Виталя"
char_gender = "male"
char_language = "ru"
char_prompt = "Ты — голосовой ассистент по имени {name}. Отвечай кратко, по делу и дружелюбно, на русском языке, если пользователь явно не попросил другой. У тебя есть инструменты для действий на компьютере пользователя (открыть приложение, создать заметку, посмотреть файлы в рабочей папке) — вызывай их только тогда, когда это реально нужно для ответа, а не по умолчанию. Если инструмент не нужен — просто отвечай текстом, без лишних вступлений."

[asr]
asr_engine = "faster_whisper"
asr_model = "small"
asr_device = "cuda"
asr_compute = "float16"
asr_language = "ru"
push_to_talk_key_name = "space"

[llm]
llm_engine = "ollama"
llm_model = "qwen3:14b"
llm_host = "http://localhost:11434"
temperature = 1.0
num_predict = -1
llm_think = true

[tts]
tts_engine = "edge_tts"
tts_voice = "ru-RU-DmitryNeural"
